apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: l3-job-boundary
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
jobs:
  scan-job:
    steps:
      - id: make-input
        name: Build a test policy subject
        uses: docker://alpine:latest
        shell: sh
        run: |
          CRITICAL=0
          MEDIUM=21
          HIGH=11
          LOW=0
          TOTAL=$(( $CRITICAL + $HIGH + $MEDIUM + $LOW ))
          cat > "$CLOUDBEES_OUTPUTS/policy-subject" << EOF
          [{
            "type": "vulnerability_scan",
            "data": {
              "summary": {
                "by_severity": {
                  "total": ${TOTAL},
                  "critical": ${CRITICAL},
                  "high":${HIGH},
                  "medium": ${MEDIUM},
                  "low": ${LOW}
                }
              }
            }
          }]
          EOF

  independent-job:
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "independent-job running"
  post-scan-job:
    needs:
      - scan-job
    steps:
      - name: Run step
        uses: docker://alpine:3.18
        run: echo "post-scan-job running"